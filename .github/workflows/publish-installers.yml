name: publish-installers

# 官网发布与源码仓库镜像独立收尾；只重跑失败的任务，不重新编译。
# 十份公开文件 = 四份桌面安装包 + 三份服务端包及各自校验文件；手机包仍只留构建产物。
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: '成功的原始 Release 构建编号'
        required: true
        type: string
      tag:
        description: '版本 tag（留空则从产物文件名里取）'
        required: false
        type: string
      only:
        description: 'both 全部、publish GitHub+官网、mirror 源码镜像、website 仅重发官网通知'
        required: false
        type: choice
        options: [both, publish, mirror, website]
        default: both

concurrency:
  group: publish-installers-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPO: aimod-cc/Agent2API
  RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  GIVEN_TAG: ${{ inputs.tag }}
  ONLY: ${{ inputs.only }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'repository_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.assets.outputs.tag }}
      artifact: ${{ steps.assets.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 核对原始构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/github-release.py validate-run --run-id "$RUN_ID"

      - name: 校验官网发布连接
        if: ${{ env.ONLY != 'mirror' }}
        env:
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
        run: python3 .github/scripts/website-release.py check

      - name: 取原始构建的电脑端与服务端产物
        if: ${{ env.ONLY != 'website' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '{windows-nsis,macos-universal,linux-desktop,linux-server-amd64,linux-server-arm64,windows-server-amd64}'
          path: dist

      - name: 清点文件并确定版本
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$ONLY" = website ]; then
            tag="$GIVEN_TAG"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?(\+[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || {
              printf '%s\n' '只重发官网通知时必须填写完整版本 tag' >&2; exit 1;
            }
          else
            bash .github/scripts/collect-assets.sh dist
            tag="v$(<dist/version.txt)"
            if [ -n "$GIVEN_TAG" ] && [ "$GIVEN_TAG" != "$tag" ]; then
              printf '%s\n' '指定 tag 与原始构建版本不一致' >&2; exit 1
            fi
            mkdir release-assets
            while IFS= read -r relative; do
              cp "dist/$relative" release-assets/
            done < dist/assets.txt
            cp dist/version.txt release-assets/
            find release-assets -maxdepth 1 -type f ! -name version.txt ! -name assets.txt ! -name notes.md -printf '%f\n' | sort > release-assets/assets.txt
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'artifact=release-files-%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 读取源码版本的发布正文
        if: ${{ env.ONLY != 'website' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.assets.outputs.tag }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: 保存同一份发布正文
        if: ${{ env.ONLY != 'website' }}
        run: |
          set -euo pipefail
          git -C source log -1 --format=%B > release-assets/notes.md
          test -s release-assets/notes.md

      - name: 保存收尾共用的十份文件
        if: ${{ env.ONLY != 'website' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: release-assets/*
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  publish:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && inputs.only != 'mirror' && inputs.only != 'website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release-assets

      - name: 安装 R2 上传工具
        run: python3 -m pip install --disable-pip-version-check boto3==1.44.1

      - name: 将十份原始文件上传到 R2
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/website-release.py prepare --directory release-assets --tag "$TAG" --manifest r2-manifest.json

      - name: 发布到构建仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/github-release.py publish --directory release-assets --tag "$TAG"

      - name: 保存官网发布清单
        uses: actions/upload-artifact@v7
        with:
          name: website-manifest-${{ env.RUN_ID }}
          path: r2-manifest.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  website:
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success' && inputs.only != 'mirror'
      && (inputs.only == 'website' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 读取本轮官网发布清单
        if: ${{ env.ONLY != 'website' }}
        uses: actions/download-artifact@v8
        with:
          name: website-manifest-${{ env.RUN_ID }}

      - name: 通知官网开放完整版本
        if: ${{ env.ONLY != 'website' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/website-release.py publish --tag "$TAG" --manifest r2-manifest.json --run-id "$RUN_ID"

      - name: 安装 R2 校验工具
        if: ${{ env.ONLY == 'website' }}
        run: python3 -m pip install --disable-pip-version-check boto3==1.44.1

      - name: 只重新核对存储并通知官网
        if: ${{ env.ONLY == 'website' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/website-release.py register --tag "$TAG" --run-id "$RUN_ID"

  mirror:
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success'
      && (inputs.only == 'mirror' || (inputs.only != 'publish' && inputs.only != 'website' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release-assets

      - name: 镜像相同附件和正文到源码仓库
        env:
          GH_TOKEN: ${{ secrets.SOURCE_RELEASE_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/github-release.py mirror --directory release-assets --tag "$TAG"
